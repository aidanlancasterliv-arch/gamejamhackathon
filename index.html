<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <title>Recipe Rush</title>
  <link rel="stylesheet" href="style.css?v=011">
</head>
<body>
  <!-- Client/UI layer: screens for the game flow (avatar -> recipe -> market -> result) -->
  <main id="app">

    <section id="screen-title" class="screen active">
      <div class="title-img-wrap">
        <img src="assets/images/title-screen.jpeg" alt="What's Cookin' title screen" class="title-img">
        <button id="title-select-avatar-btn" class="title-hotspot" aria-label="Select Avatar"></button>
      </div>
    </section>

    <section id="screen-avatar" class="screen">
      <div class="avatar-img-wrap">
        <img src="assets/images/avatar-select.png" alt="Avatar selection screen" class="avatar-img">
        <button class="avatar-hotspot" data-avatar="Aidan" aria-label="Select Aidan" style="left: 28.81%; top: 35.51%; width: 5.86%; height: 17.76%;"></button>
        <button class="avatar-hotspot" data-avatar="Annika" aria-label="Select Annika" style="left: 34.67%; top: 35.51%; width: 5.86%; height: 17.76%;"></button>
        <button class="avatar-hotspot" data-avatar="Maria" aria-label="Select Maria" style="left: 40.53%; top: 35.51%; width: 5.86%; height: 17.76%;"></button>
        <button class="avatar-hotspot" data-avatar="Sid" aria-label="Select Sid" style="left: 46.39%; top: 35.51%; width: 5.86%; height: 17.76%;"></button>
      </div>
    </section>

    <section id="screen-recipe" class="screen">
      <div class="recipe-img-wrap">
        <img src="assets/images/recipe-select.png" alt="Recipe selection screen" class="recipe-img">
        <button class="recipe-hotspot" data-recipe-id="pasta-pesto-basil" aria-label="Select Pasta Pesto Basil" style="left: 16.11%; top: 26.03%; width: 32.23%; height: 59.25%;"></button>
        <button class="recipe-hotspot" data-recipe-id="grilled-cheese-toast" aria-label="Select Grilled Cheese Toast" style="left: 49.32%; top: 26.03%; width: 31.74%; height: 59.25%;"></button>
      </div>
    </section>

    <section id="screen-market" class="screen">
      <div class="timer-widget">
        <span class="timer-label">TIME:</span>
        <div id="timer-bar-track" class="timer-track">
          <div id="timer-bar-fill" class="timer-fill"></div>
          <div class="timer-segments"></div>
        </div>
        <div class="timer-readout">⏱ <span id="timer-seconds">30</span>s</div>
      </div>

      <div class="market-layout">
        <div class="market-main">
          <div id="aisle-view" class="aisle-img-wrap">
            <img src="assets/images/supermarket.png" alt="Supermarket aisles" class="aisle-img">
            <button class="aisle-hotspot" data-aisle="Vegetables" aria-label="Vegetables aisle" style="left: 5.80%; top: 7.28%; width: 45.29%; height: 42.33%;"></button>
            <button class="aisle-hotspot" data-aisle="Carbs" aria-label="Carbs aisle" style="left: 51.81%; top: 7.28%; width: 45.29%; height: 42.33%;"></button>
            <button class="aisle-hotspot" data-aisle="Proteins" aria-label="Proteins aisle" style="left: 5.80%; top: 52.25%; width: 45.29%; height: 42.33%;"></button>
            <button class="aisle-hotspot" data-aisle="Other" aria-label="Spices &amp; pantry aisle" style="left: 51.81%; top: 52.25%; width: 45.29%; height: 42.33%;"></button>
          </div>

          <div id="shelf-view" class="hidden">
            <h2 id="shelf-title"></h2>
            <div id="shelf-items"></div>
          </div>
        </div>

        <aside class="market-sidebar">
          <div class="basket-panel">
            <div id="basket-progress" class="basket-header">Basket: <span id="basket-count">0</span>/<span id="basket-total">0</span> <span class="basket-icon">🧺</span></div>
            <ul id="recipe-checklist" class="basket-list"></ul>
            <button id="cashier-btn" class="cashier" disabled><span class="lock-icon">🔒</span>Checkout<span class="lock-icon">🔒</span></button>
          </div>
        </aside>
      </div>

      <div id="toast" class="hidden"></div>
    </section>

    <section id="screen-result" class="screen">
      <div class="result-card">
        <p class="result-eyebrow" id="result-eyebrow"></p>
        <h1 id="result-title"></h1>

        <div class="result-body">
          <div class="result-stats-left">
            <div class="result-stars" id="result-stars"></div>
            <div class="battery-shell">
              <div class="battery-fill" id="battery-fill"></div>
              <span class="battery-pct" id="battery-pct"></span>
            </div>
          </div>

          <div class="result-stats-right">
            <div class="result-info-box">
              <p>Remaining Time: <span id="result-remaining-time"></span></p>
              <p id="result-rating-line"></p>
            </div>
            <p class="result-detail" id="result-detail"></p>
          </div>

          <div class="result-avatar-wrap">
            <img id="result-avatar-img" src="" alt="Your shopper" class="result-avatar-img">
            <span class="result-mood-badge" id="result-mood-badge"></span>
          </div>
        </div>

        <button id="play-again-btn" class="primary-btn">Play Again</button>
      </div>
    </section>

  </main>

  <script src="app.js?v=011"></script>
</body>
</html>
